name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Fetch new games
        # Non-fatal: if chess.com is unreachable we still deploy the cached data
        continue-on-error: true
        run: python pipeline/fetch.py
      - name: Analyse new games
        continue-on-error: true
        run: |
          sudo apt-get install -y -q stockfish
          python pipeline/analyse.py --limit 200
          python pipeline/puzzles.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update game data" && git push)
      - name: Assemble site
        run: cp -rL site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
