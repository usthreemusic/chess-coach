<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach — Train</title>
<link rel="stylesheet" href="vendor/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground.cburnett.css">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/themes.css">
</head>
<body>
<header>
  <h1>Chess Coach</h1>
  <nav>
    <a href="index.html">Games</a>
    <a href="review.html">Review</a>
    <a href="train.html" class="active">Train</a>
    <a href="stats.html">Stats</a>
  </nav>
</header>
<main>
  <div class="empty" id="status" hidden></div>
  <div id="train" hidden>
    <div class="filters">
      <select id="filter-opening" aria-label="Opening"></select>
      <select id="filter-colour" aria-label="Colour">
        <option value="both">Both colours</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
    </div>
    <p class="summary" id="counts"></p>
    <div class="train-done empty" id="done" hidden></div>
    <div class="review" id="puzzle">
      <div class="train-col">
        <div id="board"></div>
      </div>
      <div class="side">
        <p id="prompt"></p>
        <p class="muted" id="puzzle-meta"></p>
        <div id="result"></div>
        <div class="controls">
          <button id="show-answer">Show answer</button>
          <button id="next" hidden>Next puzzle</button>
        </div>
        <p><a id="review-link">Review this game</a></p>
      </div>
    </div>
    <div class="controls">
      <button id="export">Export progress</button>
      <button id="import">Import progress</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <p class="muted" id="notice"></p>
  </div>
</main>
<script type="module" src="js/train.js"></script>
</body>
</html>
