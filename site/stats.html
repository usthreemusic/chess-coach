<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach — Stats</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Chess Coach</h1>
  <nav>
    <a href="index.html">Games</a>
    <a href="review.html">Review</a>
    <a href="train.html">Train</a>
    <a href="stats.html" class="active">Stats</a>
  </nav>
</header>
<main>
  <div class="empty" id="status" hidden></div>
  <div id="stats" hidden>
    <p class="summary" id="summary"></p>
    <section class="weak">
      <h2>Biggest weaknesses</h2>
      <ul id="weaknesses"></ul>
      <p class="muted">Error rate = mistakes and blunders per 100 of your moves. Only groups with at least 150 moves are ranked.</p>
    </section>
    <div class="chart-grid" id="charts"></div>
  </div>
</main>
<script src="vendor/chart.umd.min.js"></script>
<script type="module" src="js/stats.js"></script>
</body>
</html>
